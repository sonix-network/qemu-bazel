name: Bare-metal example

on:
  push:
    branches: [main]
    paths: ['.gitattributes', 'example/**', 'dev/**', 'modules/**', 'bazel_registry.json', '.github/workflows/example.yml']
  pull_request:
    paths: ['.gitattributes', 'example/**', 'dev/**', 'modules/**', 'bazel_registry.json', '.github/workflows/example.yml']

permissions:
  contents: read

jobs:
  uart:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check registry pins and workspace consistency
        run: python3 -m unittest discover -s dev/tools -v
        if: runner.os == 'Linux'
      - name: Check registry pins and workspace consistency (Windows)
        run: python -m unittest discover -s dev/tools -v
        if: runner.os == 'Windows'
      - name: Build and test the UART guest on the native accelerator
        if: runner.os == 'Linux'
        working-directory: example
        run: bazelisk test --test_strategy=standalone --test_output=all //:x86_64_uart_test
      - name: Check the supported Windows MinGW GLib targets
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/tools/windows-glib-scope.ps1
      - name: Build and test the UART guest with WHPX
        if: runner.os == 'Windows'
        working-directory: example
        shell: pwsh
        run: |
          $installBase = bazelisk info install_base | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Join-Path $installBase 'embedded_tools/jdk/bin'
          bazelisk test --test_strategy=standalone --test_output=all "--test_env=PATH=$runtime" //:x86_64_uart_test
